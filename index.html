<title>CREDITI &bull; Fila de Reels</title>
</head>
<body>

<div class="min-h-screen bg-[#F6F8FB] text-[#0A2540] antialiased">
 <header class="sticky top-0 z-30 backdrop-blur-xl bg-white/80 border-b border-[#E5EAF1]">
  <div class="mx-auto max-w-[1720px] px-5 md:px-8 lg:px-10 py-5 md:py-6">
   <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
    <div class="flex items-start gap-4">
     <div class="h-10 w-10 rounded-[12px] bg-[#0A2540] flex items-center justify-center shadow-sm shrink-0">
      <span class="text-white font-black text-[18px] tracking-tight">C</span>
     </div>
     <div>
      <h1 class="text-[18px] md:text-[20px] font-extrabold tracking-[-0.02em] leading-none flex flex-wrap items-center gap-x-2 gap-y-1">
       <span>CREDITI</span>
       <span class="h-4 w-px bg-[#0A2540]/20 hidden md:block"></span>
       <span class="text-[#0A2540]/60 font-bold tracking-[0.14em] text-[11px] md:text-[12px]">FILA DE REELS</span>
      </h1>
      <p class="mt-2 text-[13px] md:text-[14px] leading-[1.5] text-[#425466] max-w-[560px]">Toque na capa para salvar a imagem pronta. Gravou? Marca como usado que ele sai da fila.</p>
     </div>
    </div>
    <div class="flex flex-wrap items-center gap-3">

que eu simulo os dois.","template":"Troca de lugar"},{"id":150,"produto":"Crédito com Garantia de Veículo","capa":"EU FALO A VERDADE #150","gancho":"Senta aqui que eu preciso te contar uma coisa. Tem um detalhe que me separa de quem só quer bater meta.","desenvolvimento":"1. Eu te mostro parcela, prazo e total antes de qualquer assinatura. 2. Se não for bom pra você, eu digo e ofereço outra linha. 3. Prefiro ganhar seu respeito hoje e sua indicação a vida toda.","cta":"Comenta VERDADE se você já foi enrolado por alguém que só queria vender.","template":"Confidência"}];

<script>
const LS_KEY = 'crediti_reels_usados_v1';

/* armazenamento tolerante: usa localStorage quando existir, senão fica na memória */
let memoria = [];
const Store = {
  ler() {
    try {
      const v = window.localStorage.getItem(LS_KEY);
      return v ? JSON.parse(v) : [];
    } catch (e) { return memoria; }
  },
  gravar(arr) {
    memoria = arr;
    try { window.localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch (e) {}
  }
};

let usados = new Set(Store.ler());
let aba = 'ativos';
let busca = '';
let fTom = 'Todos';
let fProduto = 'Todos';
let limite = 24;

const $ = (s) => document.querySelector(s);

const ICO = {
  copiar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M20 6 9 17l-5-5"/></svg>',
  voltar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>',
  busca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[18px] w-[18px]"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'
};

const num = (n) => '#' + String(n).padStart(3, '0');
const pontos = (t) => t.split(/\d+\.\s/).filter(Boolean).map(s => s.trim()).filter(Boolean);
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* texto completo, pra arquivo e referência */
function roteiro(r) {
  return `REELS CREDITI ${num(r.id)} | DIA ${r.id}
PRODUTO: ${r.produto}
TOM: ${r.template}

CAPA QUE CONVERSA:
${r.capa}

ABERTURA DE CONVERSA:
${r.gancho}

DESENVOLVIMENTO:
${pontos(r.desenvolvimento).map((p, i) => `${i + 1}. ${p}`).join('\n')}

CTA:
${r.cta}

Crediti Solucoes Financeiras
#creditiitapaje`;
}

/* só a fala, do jeito que entra no teleprompter */
function fala(r) {
  return [r.gancho, ...pontos(r.desenvolvimento), r.cta].join('\n\n');
}

function copiar(texto, btn, rotulo) {
  const feito = () => {
    const antigo = btn.innerHTML;
    btn.innerHTML = ICO.ok + '<span>Copiado!</span>';
    btn.classList.add('bg-[#00D26A]', 'text-[#0A2540]');
    setTimeout(() => { btn.innerHTML = antigo; btn.classList.remove('bg-[#00D26A]', 'text-[#0A2540]'); }, 1600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(feito).catch(() => manual(texto, feito));
  } else { manual(texto, feito); }
}
function manual(texto, feito) {
  const ta = document.createElement('textarea');
  ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); feito(); } catch (e) { window.prompt('Copie o texto:', texto); }
  document.body.removeChild(ta);
}

function marcar(id) {
  usados.add(id); Store.gravar([...usados]); limite = 24; render();
}
function desmarcar(id) {
  usados.delete(id); Store.gravar([...usados]); render();
}
function zerar() {
  if (!confirm('Isso devolve todos os Reels usados para a fila de ativos. Continuar?')) return;
  usados = new Set(); Store.gravar([]); render();
}

function corTom(t) {
  if (t.includes('Percep')) return 'bg-[#0A2540] text-white';
  if (t.includes('Opini')) return 'bg-[#FFEDD5] text-[#9A3412] border border-[#FDBA74]';
  if (t.includes('Demons')) return 'bg-[#E0F2FE] text-[#0C4A6E] border border-[#7DD3FC]';
  if (t.includes('Troca')) return 'bg-[#FEF3C7] text-[#92400E] border border-[#FCD34D]';
  return 'bg-[#E6F9EF] text-[#065F46] border border-[#6EE7B7]';
}
const GRAD = ['from-[#0A2540] via-[#12355E] to-[#1E4B82]', 'from-[#0A2540] via-[#0F2F4F] to-[#1A5C8A]',
              'from-[#0A2540] to-[#0F3D6B]', 'from-[#0A1E33] via-[#0A2540] to-[#214876]'];

function filtrar() {
  const base = REELS.filter(r => aba === 'ativos' ? !usados.has(r.id) : usados.has(r.id));
  return base.filter(r => {
    if (fTom !== 'Todos' && r.template !== fTom) return false;
    if (fProduto !== 'Todos' && r.produto !== fProduto) return false;
    if (!busca.trim()) return true;
    const q = busca.toLowerCase();
    return [r.capa, r.gancho, r.desenvolvimento, r.cta, r.produto, r.template]
      .some(c => c.toLowerCase().includes(q));
  });
}

function card(r, i) {
  const usado = usados.has(r.id);
  const ps = pontos(r.desenvolvimento);
  return `
  <article class="group relative flex flex-col rounded-[20px] bg-white border border-[#E5EAF1] shadow-[0_4px_24px_rgba(10,37,64,0.06),0_1px_2px_rgba(10,37,64,0.04)] hover:shadow-[0_16px_40px_rgba(10,37,64,0.12),0_4px_12px_rgba(10,37,64,0.06)] hover:-translate-y-1 transition-all duration-300 overflow-hidden ${usado ? 'opacity-60' : ''}">
    <div class="flex items-center justify-between px-5 pt-5 pb-3">
      <div class="flex items-center gap-2">
        <span class="inline-flex h-7 items-center rounded-full bg-[#F1F5F9] px-2.5 text-[11px] font-black tracking-widest text-[#0A2540]">${num(r.id)}</span>
        <span class="inline-flex h-7 items-center rounded-full bg-[#0A2540] px-3 text-[10px] font-bold tracking-wide text-white">${esc(r.produto.toUpperCase())}</span>
      </div>
      <div class="inline-flex max-w-[42%] truncate h-7 items-center rounded-full px-3 text-[10px] font-bold leading-none ${corTom(r.template)}"><span class="truncate">${esc(r.template)}</span></div>
    </div>
    <div class="px-5">
      <div data-capa="${r.id}" role="button" class="cursor-pointer relative overflow-hidden rounded-[14px] bg-gradient-to-br ${GRAD[i % 4]} min-h-[148px] flex items-center justify-center p-6 isolate active:scale-[0.99] transition-transform">
        <div class="absolute -top-12 -right-12 h-32 w-32 rounded-full bg-white/10"></div>
        <div class="absolute left-4 top-4 h-1.5 w-1.5 rounded-full bg-[#00D26A]"></div>
        <div data-aviso class="absolute right-3 top-3 inline-flex items-center gap-1.5 rounded-full bg-white/15 px-2.5 py-1 text-[9px] font-black tracking-[0.14em] text-white/80">${usado ? 'USADO' : 'SALVAR CAPA'}</div>
        <h2 class="relative z-10 text-center text-[20px] md:text-[21px] font-black leading-[0.95] tracking-[-0.02em] text-white uppercase">${esc(r.capa)}</h2>
        <div class="absolute bottom-0 left-0 right-0 h-[3px] bg-gradient-to-r from-[#00D26A] via-[#00D26A]/80 to-transparent"></div>
      </div>
    </div>
    <div class="flex flex-1 flex-col gap-5 px-5 py-5">
      <div class="relative rounded-[14px] bg-[#F8FAFF] border border-[#E5EAF1] p-4">
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-black tracking-[0.14em] text-[#0A2540]/60">ABERTURA DE CONVERSA</span>
          <span class="h-px flex-1 bg-[#0A2540]/10"></span>
        </div>
        <p class="mt-2 text-[15px] font-bold leading-[1.35] tracking-[-0.01em] text-[#0A2540]">“${esc(r.gancho)}”</p>
      </div>
      <div>
        <div class="flex items-center gap-2 mb-3">
          <span class="text-[10px] font-black tracking-[0.14em] text-[#0A2540]/60">DESENVOLVIMENTO</span>
        </div>
        <ol class="space-y-2.5">
          ${ps.map((p, k) => `<li class="flex gap-3 text-[13.5px] leading-[1.45] text-[#1E293B]"><span class="shrink-0 mt-[1px] inline-flex h-5 w-5 items-center justify-center rounded-full bg-[#0A2540] text-[10px] font-black text-white">${k + 1}</span><span class="font-medium">${esc(p)}</span></li>`).join('')}
        </ol>
      </div>
      <div class="mt-auto">
        <div class="rounded-[14px] bg-[#E6F9EF] border border-[#B7F0D0] p-4 relative overflow-hidden">
          <div class="flex items-center gap-2 mb-1.5">
            <div class="h-1.5 w-1.5 rounded-full bg-[#00D26A]"></div>
            <span class="text-[10px] font-black tracking-[0.14em] text-[#065F46]">CTA</span>
          </div>
          <p class="text-[13px] font-semibold leading-[1.45] text-[#064E3B]">${esc(r.cta)}</p>
        </div>
      </div>
    </div>
    <div class="mt-auto flex items-center justify-between gap-2 border-t border-[#F1F5F9] bg-[#FBFDFF] px-5 py-3.5">
      <button data-fala="${r.id}" class="inline-flex h-9 items-center gap-2 rounded-full bg-[#0A2540] px-3.5 text-[12px] font-bold text-white hover:bg-[#12355E] shadow-sm transition-all active:scale-[0.98]">${ICO.copiar}<span>Copiar fala</span></button>
      <button data-tudo="${r.id}" class="inline-flex h-9 items-center gap-2 rounded-full bg-white border border-[#E5EAF1] px-3.5 text-[12px] font-bold text-[#0A2540] hover:bg-[#F6F8FB] transition-all active:scale-[0.98]">Tudo</button>
      ${usado
        ? `<button data-voltar="${r.id}" class="inline-flex h-9 items-center gap-2 rounded-full bg-white border border-[#E5EAF1] px-3.5 text-[12px] font-bold text-[#0A2540] hover:bg-[#F6F8FB] transition-all active:scale-[0.98]">${ICO.voltar}<span>Voltar</span></button>`
        : `<button data-usar="${r.id}" class="inline-flex h-9 items-center gap-2 rounded-full bg-[#00D26A] px-3.5 text-[12px] font-black text-[#0A2540] hover:brightness-95 shadow-sm transition-all active:scale-[0.98]">${ICO.ok}<span>Usei</span></button>`}
    </div>
  </article>`;
}

function render() {
  const lista = filtrar();
  const mostra = lista.slice(0, limite);
  const ativos = REELS.length - usados.size;
  const pct = Math.round((usados.size / REELS.length) * 100);

  $('#contador').innerHTML = `MOSTRANDO <span class="text-[#00D26A]">${lista.length}</span> ${aba === 'ativos' ? 'ATIVOS' : 'USADOS'}`;
  $('#restam').textContent = `${ativos} na fila`;
  $('#barra').style.width = pct + '%';
  $('#progresso').textContent = `${usados.size} de ${REELS.length} gravados (${pct}%)`;
  $('#abaAtivos').className = 'inline-flex h-9 items-center rounded-full px-4 text-[12px] font-bold transition-colors ' + (aba === 'ativos' ? 'bg-[#0A2540] text-white' : 'bg-white border border-[#E5EAF1] text-[#0A2540]');
  $('#abaUsados').className = 'inline-flex h-9 items-center rounded-full px-4 text-[12px] font-bold transition-colors ' + (aba === 'usados' ? 'bg-[#0A2540] text-white' : 'bg-white border border-[#E5EAF1] text-[#0A2540]');
  $('#abaUsados').textContent = `Usados (${usados.size})`;

  const main = $('#grade');
  if (!lista.length) {
    main.innerHTML = `<div class="mt-20 flex flex-col items-center justify-center text-center col-span-full">
      <h3 class="mt-4 text-[16px] font-bold">${aba === 'ativos' ? 'Nenhum Reels na fila' : 'Você ainda não marcou nenhum'}</h3>
      <p class="mt-1 text-[13px] text-[#425466]">${aba === 'ativos' ? 'Gravou todos ou o filtro está apertado demais.' : 'Clique em Usei quando gravar um Reels.'}</p>
    </div>`;
  } else {
    main.innerHTML = mostra.map(card).join('');
  }
  $('#maisWrap').innerHTML = limite < lista.length
    ? `<button id="mais" class="inline-flex h-11 items-center gap-2 rounded-full bg-white border border-[#E5EAF1] px-6 text-[13px] font-bold text-[#0A2540] hover:bg-[#F6F8FB] shadow-sm transition-colors">Carregar mais ${Math.min(24, lista.length - limite)} roteiros<span class="ml-1 rounded-full bg-[#0A2540] px-2.5 py-0.5 text-[11px] text-white">${limite}/${lista.length}</span></button>`
    : '';
}

/* eventos */
document.addEventListener('click', (e) => {
  const cp = e.target.closest('[data-capa]');
  if (cp) { salvarCapa(REELS.find(r => r.id === +cp.dataset.capa), cp); return; }
  const b = e.target.closest('button'); if (!b) return;
  const achar = (id) => REELS.find(r => r.id === +id);
  if (b.dataset.fala)   copiar(fala(achar(b.dataset.fala)), b);
  if (b.dataset.tudo)   copiar(roteiro(achar(b.dataset.tudo)), b);
  if (b.dataset.usar)   marcar(+b.dataset.usar);
  if (b.dataset.voltar) desmarcar(+b.dataset.voltar);
  if (b.id === 'mais')  { limite += 24; render(); }
  if (b.id === 'abaAtivos') { aba = 'ativos'; limite = 24; render(); }
  if (b.id === 'abaUsados') { aba = 'usados'; limite = 24; render(); }
  if (b.id === 'zerar') zerar();
  if (b.id === 'baixar') baixar();
  if (b.id === 'capas') baixarCapas();
});

function baixar() {
  const fila = REELS.filter(r => !usados.has(r.id));
  const txt = `CREDITI SOLUCOES FINANCEIRAS\nFILA DE REELS - ${fila.length} ativos de ${REELS.length}\n#creditiitapaje\n\n`
    + fila.map(roteiro).join('\n\n' + '='.repeat(46) + '\n\n');
  const url = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'crediti-reels-fila.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function iniciar() {
  const tons = ['Todos', ...new Set(REELS.map(r => r.template))];
  const prods = ['Todos', ...new Set(REELS.map(r => r.produto))];
  $('#fTom').innerHTML = tons.map(t => `<option value="${esc(t)}">${t === 'Todos' ? 'Todos os tons (5)' : esc(t)}</option>`).join('');
  $('#fProduto').innerHTML = prods.map(p => `<option value="${esc(p)}">${p === 'Todos' ? 'Todos os produtos' : esc(p)}</option>`).join('');
  $('#fTom').onchange = (e) => { fTom = e.target.value; limite = 24; render(); };
  $('#fProduto').onchange = (e) => { fProduto = e.target.value; limite = 24; render(); };
  $('#busca').oninput = (e) => { busca = e.target.value; limite = 24; render(); };
  $('#iconeBusca').innerHTML = ICO.busca;
  render();
}
iniciar();

/* ---------- gerador de capa 1080x1920 ---------- */
const CW = 1080, CH = 1920, SAFE_TOP = 285, SAFE_H = 1350;

function quebrar(ctx, texto, largura) {
  const linhas = []; let atual = '';
  for (const p of texto.split(' ')) {
    const teste = (atual + ' ' + p).trim();
    if (ctx.measureText(teste).width <= largura) atual = teste;
    else { if (atual) linhas.push(atual); atual = p; }
  }
  if (atual) linhas.push(atual);
  return linhas;
}

function desenharCapa(r) {
  const c = document.createElement('canvas');
  c.width = CW; c.height = CH;
  const x = c.getContext('2d');

  const g = x.createLinearGradient(0, 0, CW, CH);
  g.addColorStop(0, '#0A2540'); g.addColorStop(0.55, '#12355E'); g.addColorStop(1, '#1E4B82');
  x.fillStyle = g; x.fillRect(0, 0, CW, CH);

  x.fillStyle = 'rgba(255,255,255,0.08)';
  x.beginPath(); x.arc(CW - 80, 120, 340, 0, Math.PI * 2); x.fill();
  x.fillStyle = 'rgba(0,210,106,0.07)';
  x.beginPath(); x.arc(40, CH - 120, 300, 0, Math.PI * 2); x.fill();

  const FONTE = '900 {S}px "Arial Black", Arial, Helvetica, sans-serif';

  x.fillStyle = '#00D26A';
  x.beginPath(); x.arc(94, SAFE_TOP + 76, 15, 0, Math.PI * 2); x.fill();
  x.font = FONTE.replace('{S}', 30);
  x.fillStyle = 'rgba(255,255,255,0.92)'; x.textAlign = 'left';
  x.fillText('CREDITI', 130, SAFE_TOP + 88);
  x.textAlign = 'right'; x.fillStyle = 'rgba(255,255,255,0.4)';
  x.fillText(num(r.id), CW - 80, SAFE_TOP + 88);

  const texto = r.capa.replace(/\s#\d+$/, '').toUpperCase();
  let tam = 152, linhas = [];
  while (tam > 58) {
    x.font = FONTE.replace('{S}', tam);
    linhas = quebrar(x, texto, CW - 200);
    if (linhas.length <= 5 && linhas.length * tam * 1.12 <= 830) break;
    tam -= 6;
  }
  x.font = FONTE.replace('{S}', tam);
  x.textAlign = 'center'; x.textBaseline = 'top';
  x.fillStyle = 'white';
  x.shadowColor = 'rgba(0,0,0,0.25)'; x.shadowBlur = 24; x.shadowOffsetY = 6;
  let y = SAFE_TOP + (SAFE_H - linhas.length * tam * 1.12) / 2;
  for (const ln of linhas) { x.fillText(ln, CW / 2, y); y += tam * 1.12; }
  x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetY = 0;

  const base = SAFE_TOP + SAFE_H - 150;
  x.fillStyle = '#00D26A'; x.fillRect(80, base, 220, 7);
  x.textAlign = 'left'; x.font = FONTE.replace('{S}', 29);
  x.fillStyle = 'rgba(255,255,255,0.62)';
  x.fillText('SOLUÇÕES FINANCEIRAS', 80, base + 30);
  x.fillStyle = '#00D26A';
  x.fillText('#creditiitapaje', 80, base + 74);

  return c;
}

function salvarCapa(r, alvo) {
  const marca = () => {
    if (!alvo) return;
    const t = alvo.querySelector('[data-aviso]');
    if (t) { t.textContent = 'CAPA SALVA'; setTimeout(() => { t.textContent = 'SALVAR CAPA'; }, 2200); }
  };
  const c = desenharCapa(r);
  const nome = `crediti-capa-${String(r.id).padStart(3, '0')}.png`;
  c.toBlob((blob) => {
    if (!blob) return;
    const arq = new File([blob], nome, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [arq] })) {
      navigator.share({ files: [arq] }).then(marca).catch(() => {});
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome; a.target = '_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    marca();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}

/* baixa as capas da lista filtrada, uma a uma */
function baixarCapas() {
  const lista = filtrar().slice(0, limite);
  if (!lista.length) return;
  if (!confirm(`Vai salvar ${lista.length} capas, uma de cada vez. Continuar?`)) return;
  lista.forEach((r, i) => setTimeout(() => salvarCapa(r, null), i * 700));
}
